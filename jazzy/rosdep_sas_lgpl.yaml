sas_core:
  ubuntu: ['ros-jazzy-sas-core']
sas_msgs:
  ubuntu: ['ros-jazzy-sas-msgs']
sas_common:
  ubuntu: ['ros-jazzy-sas-common']
sas_clock:
  ubuntu: ['ros-jazzy-sas-clock']
sas_conversions:
  ubuntu: ['ros-jazzy-sas-conversions']
sas_datalogger:
  ubuntu: ['ros-jazzy-sas-datalogger']
sas_robot_driver:
  ubuntu: ['ros-jazzy-sas-robot-driver']
sas_robot_kinematics:
  ubuntu: ['ros-jazzy-sas-robot-kinematics']
sas_force_sensor:
  ubuntu: ['ros-jazzy-sas-force-sensor']

# Non-ROS dependencies of sas_robot_driver_gazebo (declared in its
# package.xml). They are not in the stock rosdep sources, so bloom-generate
# rosdebian aborts on the first unresolvable key; map them to the real
# packages that provide them.
# libmarinholab-sas-core is built by this repo (MarinhoLab/sas_cpp) before
# the ROS-package loop in build_ros2.sh.
libmarinholab-sas-core:
  ubuntu: ['libmarinholab-sas-core']
# libmarinholab-solver-qpoases is built by this repo
# (MarinhoLab/solver-qpoases) before the ROS-package loop in build_ros2.sh.
libmarinholab-solver-qpoases:
  ubuntu: ['libmarinholab-solver-qpoases']
# libdqrobotics-interface-mujoco (with MuJoCo's libmujoco.so), a dependency
# of sas_robot_driver_mujoco, is built by this repo from
# juanjqo/cpp-interface-mujoco before the ROS-package loop in build_ros2.sh.
libdqrobotics-interface-mujoco:
  ubuntu: ['libdqrobotics-interface-mujoco']
# The CMake packages sdformat14 / gz-math7 come from these OSRF debs.
sdformat_vendor:
  ubuntu: ['libsdformat14-dev']
gz_math_vendor:
  ubuntu: ['libgz-math7-dev']
# The CMake packages gz-transport13 / gz-sim8 come from these OSRF debs
# (installed in the builder base image), same rationale as sdformat_vendor /
# gz_math_vendor above; mapping them here keeps bloom-generate rosdebian from
# emitting Depends on ros-jazzy-*-vendor packages that are not installed.
gz_transport_vendor:
  ubuntu: ['libgz-transport13-dev']
gz_sim_vendor:
  ubuntu: ['libgz-sim8-dev']
